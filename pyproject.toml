[tool.ruff]
line-length = 79
# The Django services run 3.9, but scripts/workers/ is also baked into the
# python:3.7 submission-worker image (docker/prod/worker_py3_7/Dockerfile),
# so the floor for repo code is 3.7.
target-version = "py37"
extend-exclude = [
    "bower_components",
    "docs",
    "env",
    "node_modules",
    "static/CACHE",
]

[tool.ruff.lint]
# Parity with the flake8 config this replaced. That config also selected
# B, B9, C and T4, but flake8-bugbear and flake8-mypy were never installed
# in CI or pre-commit, so those prefixes matched nothing and are dropped
# rather than silently switching the rules on here.
select = ["E", "W", "F", "I"]
# E501 is delegated to the formatter, which wraps to line-length above.
# E203 conflicts with the formatter's slice spacing.
ignore = ["E203", "E501"]

[tool.ruff.lint.per-file-ignores]
# Auto-generated by makemigrations; isort skipped these too.
"*/migrations/*.py" = ["I001"]

[tool.ruff.format]
docstring-code-format = false
