repos:
  - repo: local
    hooks:
      - id: cleanup-code
        name: Clean up code (ruff)
        entry: bash scripts/tools/cleanup_code.sh
        language: system
        types: [python]
        pass_filenames: true
        stages: [commit]

  # ruff replaces black, isort, flake8, autoflake and autopep8. Its config
  # lives in pyproject.toml under [tool.ruff], so no args are needed here.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: ['--no-fix']
      - id: ruff-format
        args: ['--check', '--diff']

  - repo: https://github.com/pycqa/pylint
    rev: v3.3.6
    hooks:
      - id: pylint
        args:
          [
            '--rcfile=.pylintrc',
            '--output-format=colorized',
            '--score=y',
            '--fail-under=7.5',
            '--verbose'
          ]
        language_version: python3.9
        verbose: true
